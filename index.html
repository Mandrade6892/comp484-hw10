<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A simple and fun Giga Pet game">
    <link
      id="favicon"
      rel="icon"
      href="https://glitch.com/edit/favicon-app.ico"
      type="image/x-icon"
    >
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>This is your Giga Pet</h1>
      <p class="subtitle">Take care of your pet and keep it healthy and happy.</p>
    </header>

    <main>
      <section class="pet-image-container">
        <img
          class="pet-image"
          src="images/hound.jpg"
          alt="A happy pet dog"
        >
      </section>

      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div>Energy: <strong><span class="energy"></span></strong></div>

        <p class="pet-message">Your pet is ready to play!</p>

        <div class="button-container">
          <button class="treat-button">Treat</button>
          <button class="play-button">Play</button>
          <button class="exercise-button">Exercise</button>
          <button class="nap-button">Nap</button>

          <h2>Buddy’s DevTools Training Lab</h2>
          <p>Use these tests to inspect Buddy’s app behavior in Chrome DevTools.</p>

          <button onclick="runBuddyHealthScan()">Health Scan</button>
<button onclick="findLostToy()">Find Lost Toy</button>
<button onclick="breakBuddyMessage()">Break Message</button>
<button onclick="startZoomies()">Start Zoomies</button>
<button onclick="buggyTreatCalculator()">Buggy Treat Math</button>
<button onclick="fixedTreatCalculator()">Fixed Treat Math</button>

      </section>
        </div>
    </main>

    <script
      src="https://code.jquery.com/jquery-2.2.1.min.js"
      integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
